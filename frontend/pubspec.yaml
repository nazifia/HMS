name: hms_frontend
description: Flutter client for the HMS Django server.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.7.0
  # Web implementation of webview_flutter (an iframe). Not endorsed, so it has
  # to be listed here for `flutter build web` to have a WebView at all.
  webview_flutter_web: ^0.2.3
  http: ^1.2.0
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
